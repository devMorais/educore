<div class="login-page">
  <div class="login-card animate">

    <div class="login-header">
      <a routerLink="/" class="brand">⚡ EduCore</a>
      <h1>Esqueceu a senha?</h1>
      <p>Digite seu e-mail e enviaremos um link para redefinir sua senha</p>
    </div>

    @if (errorMessage()) {
      <div class="alert-error">⚠️ {{ errorMessage() }}</div>
    }

    @if (successMessage()) {
      <div class="alert-success">✅ {{ successMessage() }}</div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="field">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" required placeholder="seu@email.com">
      </div>
      <button class="btn-primary" type="submit" [disabled]="loading()">
        {{ loading() ? 'Enviando...' : 'Enviar link →' }}
      </button>
    </form>

    <p class="footer-links">
      Lembrou a senha? <a routerLink="/login">Voltar para o login</a>
    </p>

  </div>
</div>
