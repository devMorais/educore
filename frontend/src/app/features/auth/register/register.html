<div class="card">
  <h1>Criar conta</h1>

  @if (errorMessage()) {
  <p class="error">{{ errorMessage() }}</p>
  }

  <form (ngSubmit)="onSubmit()">
    <div class="field">
      <label>Nome</label>
      <input type="text" [(ngModel)]="name" name="name" required>
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" name="email" required>
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" [(ngModel)]="password" name="password" required>
    </div>
    <div class="field">
      <label>Confirmar senha</label>
      <input type="password" [(ngModel)]="passwordConfirmation" name="passwordConfirmation" required>
    </div>
    <button class="btn" type="submit" [disabled]="loading()">
      {{ loading() ? 'Criando...' : 'Criar conta' }}
    </button>
  </form>

  <button class="btn-outline" (click)="loginWithGoogle()">Cadastrar com Google</button>

  <p class="muted">
    Já tem conta? <a routerLink="/login">Entrar</a>
  </p>
  <p class="muted"><a routerLink="/">← Voltar para Home</a></p>
</div>
