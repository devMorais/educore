<div class="login-page">
  <div class="login-card animate">

    <div class="login-header">
      <a routerLink="/" class="brand">⚡ EduCore</a>
      <h1>Criar sua conta</h1>
      <p>Comece grátis, sem cartão de crédito</p>
    </div>

    @if (errorMessage()) {
      <div class="alert-error">⚠️ {{ errorMessage() }}</div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="field">
        <label>Nome completo</label>
        <input type="text" [(ngModel)]="name" name="name" required placeholder="Seu nome">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" required placeholder="seu@email.com">
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" [(ngModel)]="password" name="password" required placeholder="••••••••">
      </div>
      <div class="field">
        <label>Confirmar senha</label>
        <input type="password" [(ngModel)]="passwordConfirmation" name="passwordConfirmation" required placeholder="••••••••">
      </div>
      <button class="btn-primary" type="submit" [disabled]="loading()">
        {{ loading() ? 'Criando conta...' : 'Criar conta grátis →' }}
      </button>
    </form>

    <div class="divider"><span>ou</span></div>

    <button class="btn-google" (click)="loginWithGoogle()">
      <img src="https://www.google.com/favicon.ico" alt="Google" width="18">
      Cadastrar com Google
    </button>

    <p class="footer-links">
      Já tem conta? <a routerLink="/login">Entrar</a>
    </p>

  </div>
</div>
