<div class="result-page">
  <div class="result-page__content">

    <button class="result-back" (click)="goToUpload()">← Novo material</button>

    @if (!data()) {
      <div class="result-empty">
        <span style="font-size:3rem; display:block; margin-bottom:1rem">📭</span>
        <p>Nenhum mapa mental para exibir. Gere um a partir de um PDF.</p>
        <button class="result-back" (click)="goToUpload()">Fazer upload</button>
      </div>
    } @else {
      <div class="result-mindmap">
        <h1>{{ data()!.title }}</h1>
        <p class="result-mindmap__hint">🗺️ Explore os ramos do seu documento</p>
        <div class="result-mindmap__tree">
          <app-mindmap-node [node]="data()!.root" [level]="0"></app-mindmap-node>
        </div>
      </div>
    }

  </div>
</div>
