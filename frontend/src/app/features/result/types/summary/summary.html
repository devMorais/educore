<div class="result-page">
  <div class="result-page__content">

    <button class="result-back" (click)="goToUpload()">← Novo material</button>

    @if (!data()) {
      <div class="result-empty">
        <span style="font-size:3rem; display:block; margin-bottom:1rem">📭</span>
        <p>Nenhum resumo para exibir. Gere um a partir de um PDF.</p>
        <button class="result-back" (click)="goToUpload()">Fazer upload</button>
      </div>
    } @else {
      <div class="result-summary">
        <div class="result-summary__header">
          <div class="result-summary__header-top">
            <h1>{{ data()!.title }}</h1>
            <button class="result-summary__copy" (click)="copyToClipboard()" [disabled]="copying()">
              {{ copying() ? '✅ Copiado!' : '📋 Copiar resumo' }}
            </button>
          </div>
          <span class="result-summary__meta">📝 {{ data()!.word_count }} palavras</span>
        </div>

        <div class="result-summary__body">
          @for (p of paragraphs(); track p) { <p>{{ p }}</p> }
        </div>

        <h2>Pontos-Chave</h2>
        <ul class="result-summary__points">
          @for (point of data()!.key_points; track point) {
            <li>
              <span class="result-summary__check">✅</span>
              {{ point }}
            </li>
          }
        </ul>

        <div class="result-summary__footer">
          <button class="result-summary__copy-bottom" (click)="copyToClipboard()" [disabled]="copying()">
            {{ copying() ? '✅ Copiado!' : '📋 Copiar resumo' }}
          </button>
          <button class="result-back" (click)="goToUpload()">← Voltar ao Upload</button>
        </div>
      </div>
    }

  </div>
</div>
