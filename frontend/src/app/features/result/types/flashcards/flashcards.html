<div class="result-page">
  <div class="result-page__content">

    <button class="result-back" (click)="goToUpload()">← Novo material</button>

    @if (!data()) {
      <div class="result-empty">
        <span style="font-size:3rem; display:block; margin-bottom:1rem">📭</span>
        <p>Nenhum flashcard para exibir. Gere a partir de um PDF.</p>
        <button class="result-back" (click)="goToUpload()">Fazer upload</button>
      </div>
    } @else {
      <div class="result-flashcards">
        <h1>{{ data()!.title }}</h1>
        <p class="result-flashcards__counter">{{ cardIndex() + 1 }} / {{ data()!.total_cards }}</p>

        <div class="flashcard" [class.flashcard--flipped]="cardFlipped()" (click)="flipCard()">
          <div class="flashcard__inner">
            <div class="flashcard__front">
              <span class="flashcard__label">Pergunta</span>
              <p>{{ currentCard()?.front }}</p>
              <span class="flashcard__hint">Clique para ver a resposta</span>
            </div>
            <div class="flashcard__back">
              <span class="flashcard__label">Resposta</span>
              <p>{{ currentCard()?.back }}</p>
            </div>
          </div>
        </div>

        <div class="result-flashcards__nav">
          <button class="flashcard-nav-btn" (click)="prevCard()">← Anterior</button>
          <button class="flashcard-nav-btn" (click)="nextCard()">Próximo →</button>
        </div>
      </div>
    }

  </div>
</div>
